# Forced HALE diagnostic on IB Gateway PAPER only.
# The OHLC holdout was negative and this is not a promoted or live strategy.
engine: ibkr
mode: ib_paper_forced_diagnostic
allow_live: false
ib_host: 127.0.0.1
ib_port: 4002
ib_client_id: 7
ib_dashboard_client_id: 71
ib_control_client_id: 72
ib_status_client_id: 79
ib_order_tif: GTC
ib_order_ack_timeout: 5
dashboard_host: 127.0.0.1
dashboard_port: 8787

symbol: EURUSD
timeframe: 5m
lookback_days: 30
poll_seconds: 30
paper_trading_enabled: true
dry_run: false
order_quantity: 20000

# HALE M5 diagnostic selected on development/validation only.
signal_mode: hale_pullback
algo: hale_pullback
ema_fast: 20
ema_slow: 50
atr_period: 14
adx_period: 14
adx_trend_threshold: 25
bb_period: 20
bb_std: 2.0
rsi_period: 14
donchian_period: 55
cafb_context_minutes: 15
cafb_htf_fast: 8
cafb_htf_slow: 21
cafb_htf_adx_period: 14
cafb_htf_adx_min: 25
hale_round_grid: 0.005
hale_impulse_bars: 3
hale_impulse_atr: 1.0
hale_contraction_ratio: 0.6
hale_level_atr: 0.5
hale_stop_buffer_atr: 0.25
hale_target_r: 0.8
hale_pullback_bars: 1
hale_pullback_near_atr: 1.0
max_hold_bars: 6
max_hold_seconds: 1800

# A paper order is still blocked unless its target clears all modeled costs.
spread_bps: 0.6
slippage_bps: 0.3
commission_bps: 0.0
ib_round_trip_commission_usd: 4.0
min_expected_net_usd: 1.0
cost_buffer: 1.5
session_start_utc: 6
session_end_utc: 20
cafb_exclude_hours_utc: [21, 22]

# Fixed quantity plus conservative paper kill switches. No all-in sizing.
starting_equity: 100
risk_percent: 1
high_risk_mode: traditional
high_risk_safe: true
allow_unsafe_high_risk: false
hr_risk_max_cap: 2
hr_equity_floor_frac: 0.5
hr_max_consecutive_losses: 5
max_daily_loss_percent: 5
max_total_drawdown_percent: 15
max_positions: 1
max_portfolio_heat_percent: 2
max_currency_exposure: 1
max_gross_leverage: 30
min_units: 1000
unit_step: 1000
min_atr_pct: 0.0
pyramid_enabled: false
kill_switch: false
ntz_max_trades_day: 0
negative_balance_protection: true
paper_promoted: false
test_name: ib_paper_eurusd_hale_forced
