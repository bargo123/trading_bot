# Heikin-Ashi Level Exhaustion — coarse OHLC research configuration.
symbols: [EURUSD=X, GBPUSD=X, AUDUSD=X, NZDUSD=X]
symbol: EURUSD=X
timeframe: 1m
lookback_days: 7
mode: research
signal_mode: hale_fade
algo: hale_fade

starting_equity: 100
risk_percent: 2.0
high_risk_mode: traditional
high_risk_safe: true
allow_unsafe_high_risk: false
hr_risk_min: 0.25
hr_risk_max_cap: 20.0
hr_max_consecutive_losses: 999
hr_equity_floor_frac: 0.10
max_daily_loss_percent: 8.0
max_total_drawdown_percent: 30.0
max_positions: 2
max_portfolio_heat_percent: 4.0
max_currency_exposure: 2
max_gross_leverage: 30.0
min_units: 1000
unit_step: 1000
min_atr_pct: 0.0
kill_switch: false
negative_balance_protection: true

# One-way variable costs. The research selector uses the 1.5x case below.
spread_bps: 0.6
slippage_bps: 0.3
commission_bps: 0.0
commission_round_trip_usd: 0.0
cost_buffer: 1.5

session_start_utc: 6
session_end_utc: 20
cafb_exclude_hours_utc: [21, 22]
max_hold_bars: 6

atr_period: 14
adx_period: 14
ema_fast: 20
ema_slow: 50
bb_period: 20
bb_std: 2.0
rsi_period: 14

cafb_context_minutes: 5
cafb_htf_fast: 8
cafb_htf_slow: 21
cafb_htf_adx_period: 14
cafb_htf_adx_min: 15

hale_round_grid: 0.005
hale_impulse_bars: 3
hale_impulse_atr: 1.0
hale_contraction_ratio: 0.6
hale_level_atr: 0.5
hale_stop_buffer_atr: 0.15
hale_target_r: 0.8
hale_pullback_bars: 2
hale_pullback_near_atr: 0.75
