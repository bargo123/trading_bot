# Fabris NTZ + Fuller pyramiding (add to winners, trail so risk ≤ 1R)
symbol: BTC-USD
timeframe: 15m
lookback_days: 45
signal_mode: fabris_ntz
algo: fabris_ntz

starting_equity: 10000
ema_fast: 20
ema_slow: 50
atr_period: 14
bb_period: 20
bb_std: 2.0
rsi_period: 14
adx_period: 14
adx_trend_threshold: 25
donchian_period: 20

spread_bps: 2.0
slippage_bps: 1.0
min_atr_pct: 0.0
cost_buffer: 1.5
min_rr: 1.5

ntz_start_utc: 7
ntz_end_utc: 8
ntz_flatten_utc: 17
ntz_min_atr: 0.4
ntz_max_atr: 3.0
ntz_asia_max_pct: 0.03
# leave ntz_asia_max_atr unset (pct gate only)
ntz_tp_mult: 3.0
ntz_buffer: 0.0
ntz_max_trades_day: 2

# Fuller: scale in at +1R / +2R only in strong trend
pyramid_enabled: true
pyramid_max_adds: 2
pyramid_add_r: 1.0
pyramid_adx_min: 22.0

orb_bars: 2
ib_bars: 4

risk_percent: 1.0
atr_sl_mult: 1.5
atr_tp_mult: 3.0
atr_trail_mult: 2.5
rsi_oversold: 30
rsi_overbought: 70
adx_range_max: 25
adx_min: 20

max_daily_loss_percent: 6.0
max_total_drawdown_percent: 20.0
max_positions: 1
kill_switch: false
session_start_utc: 7
session_end_utc: 17
mode: paper
poll_seconds: 60
