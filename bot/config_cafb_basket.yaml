# Cost-Aware Failed-Break Basket — shared $100 research/paper configuration.
symbols:
  - EURUSD=X
  - GBPUSD=X
  - AUDUSD=X
  - NZDUSD=X
symbol: EURUSD=X
timeframe: 1m
lookback_days: 7
mode: paper
signal_mode: cafb
algo: cafb

starting_equity: 100
risk_percent: 2.0
high_risk_mode: traditional
high_risk_safe: true
allow_unsafe_high_risk: false
hr_risk_min: 0.25
hr_risk_max_cap: 20.0
hr_max_consecutive_losses: 4
hr_equity_floor_frac: 0.50
max_daily_loss_percent: 8.0
max_total_drawdown_percent: 30.0
max_positions: 2
max_portfolio_heat_percent: 4.0
max_currency_exposure: 2
max_gross_leverage: 30.0
min_units: 1000
unit_step: 1000
min_atr_pct: 0.0
kill_switch: false

# One-way cost inputs; backtests charge the sum on entry and exit.
spread_bps: 0.4
slippage_bps: 0.2
commission_bps: 0.0
cost_buffer: 1.5

session_start_utc: 6
session_end_utc: 20
cafb_exclude_hours_utc: [21, 22]
max_hold_bars: 6

atr_period: 14
adx_period: 14
ema_fast: 20
ema_slow: 50
bb_period: 20
bb_std: 2.0
rsi_period: 14

cafb_context_minutes: 5
cafb_htf_fast: 8
cafb_htf_slow: 21
cafb_htf_adx_period: 14
cafb_htf_adx_min: 12
cafb_box_bars: 5
cafb_box_min_atr: 0.1
cafb_box_max_atr: 2.5
cafb_allow_range: true
cafb_target_mode: opposite
cafb_stop_buffer_atr: 0.15
cafb_min_rr: 0.3

