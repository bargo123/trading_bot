# MT5 demo M1 firehose — EURUSD only.
# Measured 2026-08-12: GBPUSD/USDCHF/NZDUSD passed the $0.08 RT-spread gate
# when quotes briefly tightened, then sat red until 8-pip SL (equity 95.34 -> 93.94).
# Harris/Aldridge: do not scalp when spread >= the take. scratch_losers is off.
engine: mt5
mode: mt5_demo
allow_live: false
dry_run: false
paper_trading_enabled: true
mt5_path: C:\Program Files\MetaTrader 5\terminal64.exe
mt5_magic: 260812
mt5_deviation: 20
mt5_max_lots: 0.10

symbol: EURUSD
symbols:
  - EURUSD
timeframe: 1m
lookback_days: 1
poll_seconds: 1
order_quantity: 0.01

starting_equity: 100
signal_mode: firehose
algo: firehose
firehose_every_bar: true
firehose_book_filter: false
firehose_chart_read: false
firehose_skip_doji: false
firehose_require_body: false
firehose_min_er: 0.0
firehose_min_range_pips: 0.0
firehose_min_chart_score: 0
er_period: 10
htf_ema_period: 100
firehose_pip_size: 0.0001
jpy_pip_size: 0.01
firehose_tp_pips: 16
firehose_sl_pips: 8
volman_ema: 20
max_hold_seconds: 45
flatten_if_profit_usd: 0.08
scratch_losers: false
max_spread_pips: 2
max_spread_price: 0.00020
spread_bps_floor: 0.2

ema_fast: 20
ema_slow: 200
atr_period: 14
adx_period: 14
adx_trend_threshold: 99
adx_range_max: 99
donchian_period: 20
bb_period: 20
bb_std: 2.0
rsi_period: 14
min_rr: 0.01
min_atr_pct: 0.0
cost_buffer: 1.0
spread_bps: 2.26
slippage_bps: 0.4
commission_round_trip_usd: 0.0
session_start_utc: 0
session_end_utc: 24

risk_percent: 1
high_risk_mode: traditional
high_risk_safe: true
allow_unsafe_high_risk: false
hr_risk_max_cap: 2
hr_equity_floor_frac: 0.5
hr_max_consecutive_losses: 5
max_daily_loss_percent: 3.0
max_total_drawdown_percent: 12.0
max_positions: 1
pyramid_enabled: false
kill_switch: false
ntz_max_trades_day: 80
test_name: mt5_demo_m1_scalp
