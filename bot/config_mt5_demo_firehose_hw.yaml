timeframe: 1m
lookback_days: 1
poll_seconds: 1
order_quantity: 0.01
starting_equity: 100
signal_mode: firehose
algo: firehose
# CORE spray on. Book AND-stack OFF so it actually fires; mega-book intel
# still requires confluence. Not a 100% WR or $1000/day claim.
firehose_every_bar: true
firehose_book_filter: false
firehose_chart_read: true
firehose_skip_doji: true
firehose_require_body: true
firehose_min_er: 0.35
firehose_min_range_pips: 1.0
firehose_vpa_filter: true
firehose_brooks_range: true
firehose_damir_structure: true
firehose_jansen_filter: true
jansen_score_min: 0.15
jansen_z_bars: 50
firehose_harris_jump: true
harris_jump_atr: 1.8
er_period: 10
htf_ema_period: 100
firehose_pip_size: 0.0001
jpy_pip_size: 0.01
# CORE benchmark geometry only. This 1:30 payoff is the shape that produced
# WR 91.91% / PF 0.71, and it is what the Intelligent Firehose is measured against.
# It is NOT used when intelligent_firehose is true: the runner skips
# live_firehose_stops in intelligent mode and the brain supplies structural
# stops/targets that must clear intelligent_min_payoff_ratio.
firehose_tp_pips: 1
firehose_sl_pips: 30
volman_ema: 20
max_hold_seconds: 0
# Bank only when CORE flatten is on. Intelligent Firehose owns exits.
flatten_if_profit_usd: 0
scratch_losers: false
close_if_gave_back: true
lock_mfe_usd: 0.03
giveback_floor_usd: 0.01
firehose_anchor_quote: true
scratch_never_green_seconds: 0
scratch_cooldown_s: 120
max_spread_pips: 0.3
max_spread_price: 3.0e-05
spread_bps_floor: 0.2
firehose_stack: true
firehose_max_per_symbol: 3
# Same-symbol stacks are allowed, including into red. 15s spaces the 2nd/3rd clip.
firehose_clip_interval_s: 15
oms_pretrade: true
max_quote_age_s: 5
firehose_no_stack_if_red: false
ema_fast: 20
ema_slow: 200
atr_period: 14
adx_period: 14
adx_trend_threshold: 99
adx_range_max: 99
donchian_period: 20
bb_period: 20
bb_std: 2.0
rsi_period: 14
min_rr: 0.01
min_atr_pct: 0.0
cost_buffer: 0.01
spread_bps: 0.2
slippage_bps: 0.1
commission_round_trip_usd: 0.0
session_start_utc: 0
session_end_utc: 24
position_sizing_mode: fixed
risk_percent: 0.25
high_risk_mode: traditional
high_risk_safe: true
allow_unsafe_high_risk: false
hr_risk_max_cap: 2
hr_equity_floor_frac: 0.5
hr_max_consecutive_losses: 20
# These were both 0 (guards fully disabled) to keep spraying after a 39% drawdown
# off peak $94.28. That drawdown was caused by negative expectancy, not by the
# guards, and the per-trade EV gate now addresses the cause. Limits are restored
# deliberately loose - far looser than the 3%/12% defaults - so the firehose keeps
# its throughput while a genuine blowup still halts it.
max_daily_loss_percent: 10
max_total_drawdown_percent: 25
max_positions: 40
no_money_reject_limit: 3
no_money_window_s: 300
execution_backoff_s: 60
intel_enabled: false
intel_scratch_pips: 4
intel_require_htf: false
intel_require_structure: false
intel_require_body: true
intel_min_er: 0.15
# Multi-book confluence around CORE. research_proxy — not a 100% WR claim.
intel_mega_book: true
intel_mega_min_votes: 3
intel_mega_er_min: 0.15
intel_mega_jansen_min: 0.05
intel_skip_ny_open: false
intel_ny_open_hours:
- 13
- 14
- 15
intel_skip_rsi_ext: true
intel_skip_doji_against: true
intel_skip_stretched_doji_buy: true
intel_skip_stretched_buy: false
intel_skip_barbwire_sell: true
intel_skip_barbwire_buy: true
intel_skip_late_buy_chase: true
intel_skip_impulse_against: true
intel_skip_wrong_edge: false
intel_skip_above_range_buy: true
intel_skip_weak_adx_edge: false
intel_weak_adx: 22.0
pyramid_enabled: false
kill_switch: false
ntz_max_trades_day: 200
test_name: mt5_demo_firehose_hw
# Intelligent Firehose demo brain — thesis/EV/exposure (not heuristic intel stack).
intelligent_firehose: true
intelligent_firehose_bootstrap: true
intel_enabled: false
intelligent_risk_budget_usd: 100
intelligent_risk_fraction: 0.08
intelligent_min_analogues: 20
intelligent_min_similarity: 0.55
intelligent_max_clips_per_thesis: 5
max_currency_direction_positions: 10
analogue_index_path: intel/analogue_index.json
knowledge_table_path: intel/knowledge_table.json
intelligent_champion_path: intel/intelligent_champion.json
# Live entries are gated to states the research pipeline validated on OOS holdout.
# The full analogue index is net-negative after costs; firing outside validated
# states was the losing behavior. The allowlist is regenerated by the ML pipeline
# each watcher cycle from strategy_selection survivors.
validated_states_path: intel/validated_states.json
# Symbol-aware opportunities (LEVEL A/B/C with per-symbol costs) are the primary
# gate; the pooled-state allowlist above remains as the cross-symbol fallback.
validated_opportunities_path: intel/validated_opportunities.json
intelligent_gate_validated_states: true
# DEMO CANARY governance: the evidence bootstrap stays UNVALIDATED_RESEARCH
# (shadow decisions, zero orders) unless this flag is set. With it set, a fire
# still requires, at decision time: measured provenance, exact-state analogue
# evidence passing n>=20 / losses>=5 / expectancy>0 / PF>1 / bootstrap p05>0 /
# payoff sanity, membership in a validated opportunity or state, positive
# per-trade economics after live spread+commission, and portfolio room.
intelligent_bootstrap_canary: true

# --- Exploration Firehose (DEMO-only tiny-risk hypothesis testing) ---
# Actively tests many registered falsifiable hypotheses with bounded tiny
# exposure. NOT profitable, NOT validated; information gain only. These limits
# are independent of champion/canary limits and never bypass portfolio,
# spread, stale-quote, or live-account protections.
intelligent_exploration_enabled: true
exploration_max_positions: 2
exploration_max_positions_per_symbol: 1
exploration_max_daily_loss_usd: 1.0
exploration_max_risk_per_trade_usd: 0.15
exploration_max_trades_per_hypothesis: 5
exploration_cooldown_after_failure_s: 1800
exploration_inactivity_warn_min: 90

# --- Per-trade economics (the WR 91.91% / PF 0.71 fix) ---
# Reward must be at least this multiple of the structural invalidation distance.
# 1.0 kills the 1-pip-target / 30-pip-stop shape without throttling throughput.
intelligent_min_payoff_ratio: 1.0
# Expected net value, after live spread and commission, must exceed this.
intelligent_min_expected_net_usd: 0.0
# Size each clip from the validated risk fraction and invalidation distance rather
# than sending a fixed order_quantity behind every stop distance.
intelligent_edge_sizing: true
# Analogue evidence must be built from real market history. Leave false: the
# offline index is a synthetic fixture that reports a fabricated PF of 6.0.
intelligent_allow_synthetic_evidence: false
# Pool analogue evidence across symbols for the same state. Restricting evidence to
# one symbol splits a 759-observation state into ~30 per pair, which stops clearing
# the 95% lower-bound test and hides the only two states that measurably have an
# edge. Symbol still counts in the similarity score, so same-symbol analogues rank
# first; this only stops discarding the rest.
intelligent_pool_across_symbols: true
# Reject ticks stamped ahead of local time (broker clock skew / corrupt ticks).
max_quote_future_skew_s: 5
