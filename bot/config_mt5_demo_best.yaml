# MT5 demo — bake-off winner on Yahoo EURUSD 1h (400d, 9476 bars).
# Winner: ensemble (2-of-4: book_optimal, breakout_adx, trend_pullback, hw_range).
# Sample: 10 trades, 40% WR, E[R]=+0.045, +$22 on $10k. Thin edge. NOT 100% WR.
# Tharp: expectancy ranked this, not win rate. Yahoo 1h ≠ live M1.
engine: mt5
mode: mt5_demo
allow_live: false
dry_run: false
paper_trading_enabled: true
mt5_path: C:\Program Files\MetaTrader 5\terminal64.exe
mt5_magic: 260814
mt5_deviation: 20
mt5_max_lots: 0.10

symbol: EURUSD
symbols:
  - EURUSD
timeframe: 1h
lookback_days: 60
poll_seconds: 60
order_quantity: 0.01

starting_equity: 100
signal_mode: ensemble
algo: ensemble
ensemble_min_votes: 2
ensemble_members:
  - book_optimal
  - breakout_adx
  - trend_pullback
  - hw_range
firehose_every_bar: false
max_hold_seconds: 0
scratch_losers: false
flatten_if_profit_usd: 0
max_positions: 1
ntz_max_trades_day: 4

ema_fast: 50
ema_slow: 200
atr_period: 14
adx_period: 14
adx_trend_threshold: 25
adx_range_max: 22
adx_min: 15
donchian_period: 55
bb_period: 20
bb_std: 2.0
rsi_period: 14
rsi_oversold: 30
rsi_overbought: 70
rsi_pullback: 45
rsi_pullback_hi: 55
atr_sl_mult: 2.5
atr_tp_mult: 0.8
atr_trail_mult: 3.0
min_atr_pct: 0.0004
min_rr: 1.5
thomas_rr: 4.0
cost_buffer: 1.5
book_min_triggers: 1
book_require_vwap: false
book_adx_max: 50
orb_bars: 2
ib_bars: 4
ntz_start_utc: 7
ntz_end_utc: 8
ntz_flatten_utc: 17
ntz_min_atr: 0.3
ntz_max_atr: 4.0
ntz_asia_max_pct: 0.05
firehose_pip_size: 0.0001
jpy_pip_size: 0.01
spread_bps: 2.26
slippage_bps: 0.4
commission_round_trip_usd: 0.0
session_start_utc: 7
session_end_utc: 21

risk_percent: 1
high_risk_mode: traditional
high_risk_safe: true
allow_unsafe_high_risk: false
hr_risk_max_cap: 2
hr_equity_floor_frac: 0.5
hr_max_consecutive_losses: 5
max_daily_loss_percent: 3.0
max_total_drawdown_percent: 12.0
pyramid_enabled: false
kill_switch: false
test_name: mt5_demo_ensemble_best
